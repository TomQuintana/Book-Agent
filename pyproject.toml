[project]
name = "asta-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=25.12.0",
    "chromadb>=1.4.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "isort>=7.0.0",
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=0.3.16",
    "langchainhub>=0.1.21",
    "langgraph>=1.0.5",
    "pytest>=9.0.2",
    "prompt-toolkit>=3.0.0",
    "python-dotenv>=1.2.1",
    "rich>=13.0.0",
    "sqlmodel>=0.0.24",
    "tavily-python>=0.7.17",
    "uvicorn>=0.40.0",
    "langfuse>=4.5.1",
    "ruff>=0.8.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, D pydocstyle, T20 no-print
select = ["E", "F", "I", "UP", "B", "D", "T20"]
# D104 (paquete __init__) y D107 (__init__ method) fuera: no se exige docstring ahí
ignore = ["D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
# All built-in flags — no plugins. Applied to every `uv run pytest`.
addopts = "-v -ra --tb=short --strict-markers --durations=5 --color=yes"
testpaths = ["tests"]
